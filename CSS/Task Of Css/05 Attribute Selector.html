<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute Selector</title>
    <!--Internel CSS-->
    <style>
        body{
            background-color: burlywood;
        }
        /*Attribute selector*/
        input[type="text"]{
            margin: 0 auto;
            padding: 60px;
            height: 35px;
            border: 10px solid black;
            background-color: aquamarine;
            font-size: 10px;
        }
        input[type="password"]{
            margin: 0 auto;
            height: 60px;
            padding: 50px;
            border: 6px solid gold;
            background-color: tomato;
            font-size: 12px;
        }
        input[type="email"]{
            margin: 0 auto;
            padding: 60px;
            height: 50px;
            border: 10px solid blue;
            background-color: powderblue;
            font-size: 12px; 
        }
        input[type="number"]{
            margin: 0 auto;
            padding: 70px;
            height: 75px;
        }



    </style>
</head>
<body>
    <h1>Attribute Selector</h1>
    <hr>
    <input type="text">
    <br>
    <input type="password">
    <br>
    <input type="email">
    <br>
    <input type="number">

</body>
</html>
