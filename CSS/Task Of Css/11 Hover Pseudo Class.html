<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Pseudo Class</title>
    <!--Internal Css-->
    <style>
        h1{
            font-size: 20px;
        }
        button{
            height: 35px;
            width: 0 auto;
            background-color: aquamarine;
            color: goldenrod;
            font-size: 20px;
        }
        /*Hover pseudo Class */
        button:hover{
            background-color:aqua;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>Hover Pseudo Class Selector</h1>
    <hr>
    <button>Login</button>
    <button>CLick Me</button>
    <button>Sign Up</button>
    
</body>
</html>
