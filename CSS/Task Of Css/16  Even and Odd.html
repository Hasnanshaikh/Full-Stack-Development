<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Even and Odd Selector</title>
    <!--Internal Css-->
    <style>
        ol{
            background-color: burlywood;
            font-size: 25px skyblue;
            color: red;
        }
        li:nth-child(even){
           background-color: blueviolet;
        }
        li:nth-child(odd){
            background-color: gold;
        }
    </style>
</head>
<body>
    <h1> Even and Odd Selector</h1>
    <hr>
    <h2>Ice Cream Flavours</h2>
    <ol>
        <li>Vanila</li>
        <li>Dry Fruits</li>
        <li>Jelly Belly</li>
        <li>Rose Gold</li>
        <li>Kaju Pista</li>
        <li>Chocolate Nuts</li>
        <li>Stawberry</li>
        <li>Mango</li>
    </ol>
</body>
</html>
