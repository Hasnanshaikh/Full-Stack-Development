<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nth-child()</title>
    <!--Internal Css-->
    <style>
        ol{
            font-size: 25px;
            color: violet;
        }
        li:nth-child(even){
            font-size: 40px;
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Nth-child() Selector</h1>
    <hr>
    <h2>First Child Class Selector In Css</h2>
    <ol>
        <li>Hasnan</li>
        <li>Hamzah</li>
        <li>Mihir</li>
        <li>Aditya</li>
        <li>Pragnya</li>
        <li>Jenil</li>
    </ol>

    
</body>
</html>
