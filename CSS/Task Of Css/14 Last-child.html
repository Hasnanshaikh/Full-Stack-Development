<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last-child</title>
    <!--internal Css-->
    <style>
        ul{
            background-color: gold;
            font-size: 25px;
            color: red;
        }
        li:last-child{
            font-size: 35px;
            color:blue;
        }

    </style>
</head>
<body>
    <h1>Last-child Selector</h1>
    <hr>
    <ul>
        <li>Hasnan</li>
        <li>Hamzah</li>
        <li>Jenil</li>
        <li>Mihir</li>
    </ul> 
    
    
</body>
</html>
