<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Collapse</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box1{
            background-color: red;
            margin: 30px;
            height: 500px;
            width: 250px;
            border: 2px solid blue;

        }
        .box2{
            background-color: aqua;
            /* margin: 30px; */
            height: 20px;
            /* padding: 2px; */
            width: 100%;
            border: 5px solid hotpink;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nihil, quia officia in consequuntur quibusdam eum ipsa magni quas dicta! Unde eum quos numquam ducimus, quas sunt totam? Ipsa est ab, quos odit quibusdam nobis.</div>
    <div class="box2">
    </div>
    
</body>
</html>
