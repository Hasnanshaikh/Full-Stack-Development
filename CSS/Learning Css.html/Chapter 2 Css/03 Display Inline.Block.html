<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Element</title>
    <!-- Display Inline Block -->
    <style>
        .box1{
            display:inline-block;
            width: 544px;
            height: 75px;
            background-color: violet;
            margin-top: 84px;
            margin: 36px;
            padding: 45px;
             
        }
        .box2{
            display:inline-block ;
            width: 54px;
            height: 75px;
            background-color: blue;
            margin: 34px;
            padding: 45px;
        }
    </style>
</head>
<body>
    <div class="box1">
        Lorem ipsum dolor 
    </div>
    <div class="box2">
        Lorem ipsum dolor, 
    </div>

</body>
</html>
