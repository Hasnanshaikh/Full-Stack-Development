<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callspan And Rowspan</title>
</head>
<body>
    <center>
      <table bgcolor="#f2f3f7" border="3">
         <th rowspan="3">Day</th>
         <th colspan="3">Seminar</th>
         <tr>
            <th rowspan="2">Schedule</th>
            <th colspan="2">Topic</th>
         </tr>
         <tr>
             <th>Begin</th>
             <th>End</th>
         </tr>
         <tr>
            <td rowspan="2">Monday</td>
            <td rowspan="2">8.00a.m</td>
            <td rowspan="2">5.00p.m</td>
            <td>Introduction to XML.</td>
         </tr>
         <tr>
             <td>Validity DTD and Relax NG</td>
         </tr>
         <tr>
            <td rowspan="4">Tuesday</td>
            <td>8.00a.m</td>
            <td>11.00a.m</td>
            <td rowspan="2">Xpath</td>
         </tr>
         <tr>
             <td rowspan="2">11.00a.m</td>
             <td rowspan="2">2.00p.m</td>
         </tr>
         <tr>
            <td rowspan="2">XSL transformation</td>
         </tr>
         <tr>
             <td>2.00pm.</td>
             <td>5.00pm.</td>
         </tr>
         <tr>
            <td>Wednesday</td>
            <td>11.00a.m</td>
            <td>12.00p.m</td>
            <td>XLS formating objects</td>
         </tr>
      </table>

    </center>
    
</body>
</html>
