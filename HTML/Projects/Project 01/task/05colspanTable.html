<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colspan and rowspan</title>
</head>
<body bgcolor="#f3f5f7">
    <center>
      <table bgcolor="#f1f1f1" border="2">

       <h1>TIME TABLE OF CLASS 5</h1>
       <hr>
       <th colspan="6">Time Table</th>
       <tr>
         <td rowspan="6">Hours</td>
         <th>Monday</th>
         <th>Tuesday</th>
         <th>Wednesday</th>
         <th>Thursday</th>
         <th>Friday</th>
       </tr>
       <tr>
        <td>Science</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Maths</td>
        <td>Arts</td>
       </tr>
       <tr>
         <td>Science</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Maths</td>
        <td>Arts</td>
       </tr>
       <tr>
        <th colspan="5">Lunch</th>
       </tr>
       <tr>
        <td>Science</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Maths</td>
        <td rowspan="2">Project</td>
       </tr>
       <tr>
        <td>Science</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Maths</td>
       </tr>

     
      </table>
    </center>
</body>
</html>
