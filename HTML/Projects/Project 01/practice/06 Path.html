    <h1>Path in HTML</h1>
    <p>Paths in HTML are used to specify the location of resources such as images, stylesheets, and scripts.</p>
    <p>There are two main types of paths in HTML:</p>
    <ul>
        <li><strong>Absolute Paths</strong></li>
        <li><strong>Relative Paths</strong></li>
    </ul>
