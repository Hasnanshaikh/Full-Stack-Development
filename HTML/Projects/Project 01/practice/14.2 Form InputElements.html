<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms And Their Input Elements  </title>
</head>
<body bgcolor="#f1f1f1">
    <h1>Forms And Their Input Elements</h1>
    <hr>
    <fieldset>
        <legend>Forms Input Elements</legend>
        <input type="text" name="username" placeholder="Enter your  name"/>
        <br>
        <br>
        <input type="password" name="password" placeholder="Enter your Password"/>
        <br>
        <br>
        <input type="email" name="email" placeholder="Enter your  email"/>
        <br>
        <br>
        <input type="number" name="age" placeholder="Enter your  age"/>
        <br>
        <br>
        <input type="date" name="dob" placeholder="Enter your  date of birth"/>
        <br>
        <br>
        <input type="file" name="profile_picture" />
        <br>
        <br>
        <input type="tel" name="Phone" placeholder="Enter your Phone number"/>
        <br>
        <br>
        <input type="url" name="website" placeholder="Enter your website url"/>
        <br>
        <br>
        <input type="image" name="image" src="image.jpg" alt="Image"/>
        <br>
        <br>
        <input type="date" name="dob" placeholder="Enter your  date of birth"/>
        <br>
        <br>
        <input type="hidden" name=" hidden_field" value=" hidden_value " />
        <br>
        <br>
        <input type="range" name="rating" min="1" max="10"/>
        <br>
        <br>
        <input type="color" name="favorite_color"/>
        <br>
        <br>
        <input type="reset" value="Reset Form"/>
        <br>
        <br>
        <input type="submit" value="Submit Form"/>
        <br>
        <br>
        <input type="Appoitnment" name="Appoitnment" placeholder="Enter your Appoitnment date and time"/>
        <br>
        <br>
        <input type="month" name=" birth_month" placeholder="Enter your birth_month"/>
        <br>
        <br>
        <input type="week" name="birth_week" placeholder="Enter your birth_week"/>
        <br>
        <br>
        <input type="search" name="search_query" placeholder="Search.."/>
        <br>
        <br>
        <input type="time" name="meeting_time" placeholder="Enter your meeting_time"/>
        <br>
        <br>
        <input type="datetime-local" name="local_datetime" placeholder="Enter your local_datetime"/>
        <br>
        <br>
        <input type="button" value="Click Me"/>
        <br>
        <br>
    </fieldset>
    <hr>
    <fieldset>
        <legend>Form input checkbox radio </legend>
        <label for="Gender">Gender</label>
        <input type="radio" id="Male" name="Gender" value="Male"/>
        <label for ="male">Male</label>
        <input type="radio" id="Female" name="Gender" value="Female"/>
        <label for="Female">Female</label>
        <input type="radio" id="Other" name="Gender" value="other"/>
        <label for ="Other">Other</label>
        <br>
        <br>
        <br>
        <label for="hobbies">Hobbies</label>
        <input type="checkbox" id="writing" name="Hobbies" value="writing"/>
        <label type="Writing">Writing</label>
         <input type="checkbox" id="Reading" name="Hobbies" value="writing"/>
        <label type="Reading">Reading</label> 
        <input type="checkbox" id="cycling" name="Hobbies" value="cycling"/>
        <label type="cycling">Cycling</label>
        <br>
        <br>
        <textarea cols="40" rows="10" placeholder="Enter your Suggestion"></textarea>
    </fieldset>
    <br>
    <br>
    <select>
        <label for="Hobby">Hobby</label>
        <option value="Writing">Writing</option>
        <option value="Reading">Reading</option>
        <option value="Cycling">Cycling</option>
    </select>

</body>
</html>
