<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Tags </title>
</head>
<body bgcolor="#f1f1f1">
    <h1>Forms Tags in Html </h1>
    <hr>
    <br>
    <fieldset>
        <legend>Personal Id And Passwords</legend>
        <form action="" method="post" enctype="multipart/form-data">

            
            <Label for="Name">Email Id</Label>
            <input type="text" id="Email" Name="UserId" placeholder="Enter your Email" />
            <br>
            <br>
            <Label for="Password">Password</Label>
            <input type="text" id="Passwords" name="Password" placeholder="Enter your Password"/>
            <br>
            <br>
           <button type="submit">Submit</button>

        </form>
    </fieldset>
</body>
</html>
