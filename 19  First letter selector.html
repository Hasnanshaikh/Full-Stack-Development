<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::First letter selector </title>
    <style>
        h1{
            color: aliceblue;
            background-color: lightblue;
            font-size: 35px;
        }
        p{
            font-size: 25px;
        }
        /* First Letter As Selector */
        p::first-letter{
            font-size: 50px;
            color: lightcoral;
        }
    </style>
</head>
<body>
    <h1>First letter selector</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Vero numquam ducimus sint exercitationem? Asperiores, saepe amet quidem illo blanditiis unde, culpa quisquam omnis temporibus, sit perferendis beatae id dicta tempora!</p>

</body>
</html>
