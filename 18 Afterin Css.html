<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After In Css</title>
    <!--Internal Css-->
    <style>
        h1{
            background-color: lightcyan;
            color: lightcoral;
            font-size: 35px;
        }
        p{
            background-color: lightblue;
            color: azure;
            font-size: 25px;
        }
        /* After Css */
        p::after{
            content:'/2714';
            color: lightgrey;
        }
    </style>
</head>
<body>
    
    <h1>::After Class in Css</h1>
    <p>Hi its a paragragh of Testing after css</p>
    <p>Hi its a paragragh of Testing after css</p>
    
</body>
</html>
